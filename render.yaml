# Render Blueprint: crea el servicio web y la base PostgreSQL con un solo clic.
# Render → New → Blueprint → elige este repositorio.
services:
  - type: web
    name: biblioqr
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Enlace público de demostración: acceso con un clic por rol y reinicio de datos.
      # Cámbialo a "0" (y configura SMTP_*) cuando quieras usar correos reales.
      - key: MODO_DEMO
        value: "1"
      - key: DOMINIO_INSTITUCIONAL
        value: aula.edu.pe
      - key: TZ_BIBLIOTECA
        value: America/Lima
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biblioqr-db
          property: connectionString

databases:
  - name: biblioqr-db
    plan: free
    databaseName: biblioqr
    user: biblioqr
